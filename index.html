<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestió de Racons: Mates i Llengua</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --mates-color: 59, 130, 246;
            --llengua-color: 249, 115, 22;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background-color: #ffffff;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* "Coses per atras" - Blobs de color difuminats */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -2;
            opacity: 0.4;
            animation: floatBlob 15s infinite ease-in-out alternate;
        }
        .blob-1 { width: 500px; height: 500px; background: rgb(var(--mates-color)); top: -150px; left: -100px; }
        .blob-2 { width: 400px; height: 400px; background: rgb(var(--llengua-color)); bottom: -100px; right: -100px; animation-delay: -5s; }
        
        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 80px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.9); }
        }

        /* Símbols surant per darrere */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            padding: 40px;
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.05);
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        h1 {
            margin: 0 0 25px 0;
            font-size: 2.2em;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        /* Sistema de Pestanyes */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            background: #f1f5f9;
            padding: 6px;
            border-radius: 50px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }
        .tab-btn {
            font-family: 'Inter', sans-serif;
            background: transparent;
            border: none;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active.mates {
            background: rgb(var(--mates-color));
            color: white;
            box-shadow: 0 4px 10px rgba(var(--mates-color), 0.3);
        }
        .tab-btn.active.llengua {
            background: rgb(var(--llengua-color));
            color: white;
            box-shadow: 0 4px 10px rgba(var(--llengua-color), 0.3);
        }

        .subtitol {
            font-family: 'Caveat', cursive;
            font-size: 1.8em;
            color: #64748b;
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 25px;
        }

        button {
            font-family: 'Inter', sans-serif;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        #btnSorteig.mates {
            background: rgb(var(--mates-color));
            color: white;
            box-shadow: 0 4px 10px rgba(var(--mates-color), 0.2);
        }
        #btnSorteig.llengua {
            background: rgb(var(--llengua-color));
            color: white;
            box-shadow: 0 4px 10px rgba(var(--llengua-color), 0.2);
        }

        /* Botó "Tots els dies" (estil contorn del color de l'assignatura) */
        #btnTotsDies.mates {
            background: transparent;
            border: 1.5px solid rgb(var(--mates-color));
            color: rgb(var(--mates-color));
        }
        #btnTotsDies.llengua {
            background: transparent;
            border: 1.5px solid rgb(var(--llengua-color));
            color: rgb(var(--llengua-color));
        }
        #btnTotsDies.mates:hover:not(:disabled) {
            background: rgba(var(--mates-color), 0.08);
        }
        #btnTotsDies.llengua:hover:not(:disabled) {
            background: rgba(var(--llengua-color), 0.08);
        }

        /* Botó imprimir */
        #btnImprimir {
            background: #0f172a;
            color: white;
            box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }
        
        button:disabled {
            background: #e2e8f0 !important;
            color: #94a3b8 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            transform: none;
            border: 1px solid #cbd5e1 !important;
        }

        button.reset {
            background: transparent;
            border: 1px solid #cbd5e1;
            color: #64748b;
        }
        button.reset:hover:not(:disabled) {
            background: #fef2f2;
            border-color: #ef4444;
            color: #ef4444;
        }

        .grids-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            padding-bottom: 20px;
        }

        .graella-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.03);
            animation: slideDown 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
            text-align: left;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .titol-dia {
            font-family: 'Inter', sans-serif;
            font-size: 1.2em;
            font-weight: 700;
            margin-bottom: 20px;
            color: #334155;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 50px;
        }

        .pilars-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pilar {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            width: 160px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .pilar-header {
            padding: 12px 0;
            font-weight: 700;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        #mates-content .pilar-header { 
            background: #eff6ff; 
            color: rgb(var(--mates-color));
            border-bottom: 1px solid #dbeafe;
        }
        #llengua-content .pilar-header { 
            background: #fff7ed; 
            color: rgb(var(--llengua-color));
            border-bottom: 1px solid #ffedd5;
        }

        .pilar-body {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
        }

        .persona-slot {
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            color: transparent;
            opacity: 0;
            transform: scale(0);
        }

        .persona-slot.filled {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .nota {
            margin-top: 30px;
            font-family: 'Caveat', cursive;
            font-size: 1.5em;
            color: #94a3b8;
            text-align: center;
        }

        /* Capçalera només visible en imprimir */
        .print-header {
            display: none;
        }

        @media (max-width: 768px) {
            .pilar { width: 110px; }
            .persona-slot { height: 40px; font-size: 18px; }
            h1 { font-size: 1.8em; }
        }

        /* ============ ESTILS D'IMPRESSIÓ (PDF) ============ */
        @media print {
            @page { size: A4; margin: 12mm; }

            * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                background: #ffffff !important;
                display: block;
                padding: 0;
            }

            /* Amagar tot el que no és contingut */
            .blob, #bgCanvas, .tabs, .controls, .nota, h1 { display: none !important; }

            .container {
                max-width: 100%;
                background: #ffffff !important;
                border: none !important;
                box-shadow: none !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                border-radius: 0;
                padding: 0;
                margin: 0;
            }

            /* Mostrar només les assignatures amb sorteigs (classe .print-show la posa el JS) */
            #mates-content:not(.print-show),
            #llengua-content:not(.print-show) { display: none !important; }
            #mates-content.print-show,
            #llengua-content.print-show { display: block !important; }

            /* Llengua comença en pàgina nova (només si també s'imprimeix Mates) */
            #mates-content.print-show + #llengua-content.print-show {
                break-before: page;
                page-break-before: always;
            }

            /* Capçalera d'impressió */
            .print-header {
                display: block;
                text-align: left;
                border-bottom: 3px solid #0f172a;
                padding-bottom: 8px;
                margin-bottom: 15px;
            }
            .print-title {
                margin: 0;
                font-size: 20px;
                font-weight: 800;
                color: #0f172a;
            }
            .print-date {
                font-size: 12px;
                color: #64748b;
                margin-top: 4px;
            }

            /* Ordre cronològic: Dia 1 primer (a pantalla el més nou és a dalt) */
            .grids-container {
                flex-direction: column-reverse;
                gap: 14px;
            }

            .graella-card {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
                box-shadow: none;
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* Pilars ajustats a amplada A4, tots en una fila */
            .graella-card .pilars-container {
                gap: 10px;
                flex-wrap: nowrap;
            }
            .pilars-container .pilar {
                width: auto;
                flex: 1 1 0;
                min-width: 96px;
            }

            .pilar-body .persona-slot {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
                height: 42px;
                font-size: 18px;
                box-shadow: none;
            }
            .pilar-body .persona-slot.filled {
                background: #ffffff;
                border: 1.5px solid #334155;
                color: #0f172a;
            }
        }
    </style>
</head>
<body>

<!-- Blobs de fons -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<canvas id="bgCanvas"></canvas>

<div class="container">
    <h1>Gestió de Racons</h1>
    
    <div class="tabs">
        <button class="tab-btn mates active" onclick="canviarPestanya('mates')">Matemàtiques</button>
        <button class="tab-btn llengua" onclick="canviarPestanya('llengua')">Llengua</button>
    </div>

    <div class="controls">
        <button id="btnSorteig" class="mates" onclick="sorteigGlobal()">Sorteig del Dia</button>
        <button id="btnTotsDies" class="mates" onclick="totsElsDies()">Tots els dies</button>
        <button class="reset" id="btnNovaBaralla" onclick="novaBarallaActual()" disabled>Nova baralla</button>
        <button id="btnImprimir" onclick="imprimirPDF()">Imprimir / PDF</button>
    </div>

    <!-- CONTINGUT MATEMÀTIQUES -->
    <div id="mates-content">
        <div class="print-header">
            <h2 class="print-title">Racons de Matemàtiques</h2>
            <div class="print-date" id="printDateMates"></div>
        </div>
        <div class="grids-container" id="graelles-mates"></div>
    </div>

    <!-- CONTINGUT LLENGUA -->
    <div id="llengua-content" style="display: none;">
        <div class="print-header">
            <h2 class="print-title">Racons de Llengua</h2>
            <div class="print-date" id="printDateLlengua"></div>
        </div>
        <div class="grids-container" id="graelles-llengua"></div>
    </div>

    <div class="nota">
        "Fer un sorteig de 'Nova baralla' quan ja han passat per tots."
    </div>
</div>

<script>
    // --- CLASSE PER GESTIONAR EL JOC DE CADA ASSIGNATURA ---
    class SorteigAssignatura {
        constructor(assignatura, containerId) {
            this.assignatura = assignatura;
            this.containerId = containerId;
            this.TOTAL_DIES = 5;
            this.NUM_RACOS = 5;
            this.PER_RACO = 5;
            this.TOTAL_ALUMNES = 25;
            // Clau nova (v2): evita carregar partides antigues amb números repetits
            this.clau = 'sorteig_v2_' + assignatura;
            this.diaActual = 1;
            this.historialResultats = [];
            this.carregarEstat();
        }

        carregarEstat() {
            const savedData = localStorage.getItem(this.clau);
            if (savedData) {
                const data = JSON.parse(savedData);
                this.diaActual = data.diaActual;
                this.historialResultats = data.historialResultats;
                this.renderitzarHistorial();
            } else {
                this.guardarProgres();
            }
        }

        guardarProgres() {
            localStorage.setItem(this.clau, JSON.stringify({
                diaActual: this.diaActual,
                historialResultats: this.historialResultats
            }));
        }

        // Quins racós ha visitat ja cada alumne (es dedueix de l'historial)
        racosVisitats() {
            const visitats = Array.from({length: this.TOTAL_ALUMNES + 1}, () => new Set());
            this.historialResultats.forEach(resultatsDia => {
                resultatsDia.forEach((alumnes, raco) => {
                    alumnes.forEach(num => visitats[num].add(raco));
                });
            });
            return visitats;
        }

        sorteigDia() {
            if (this.estaAcabat()) return;

            const resultatsDia = this.generarDistribucio();
            if (!resultatsDia) return;

            this.historialResultats.push(resultatsDia);
            this.renderitzarGraella(this.diaActual, resultatsDia, true);
            this.diaActual++;
            this.guardarProgres();
        }

        // NOU: fa el sorteig de TOTS els dies que falten d'un sol cop
        generarRestaDies() {
            let index = 0;
            while (!this.estaAcabat()) {
                const resultatsDia = this.generarDistribucio();
                if (!resultatsDia) break;
                this.historialResultats.push(resultatsDia);
                // Cada dia entra escalonat (offset) perquè es vegi la cascada
                this.renderitzarGraella(this.diaActual, resultatsDia, true, index * 500);
                this.diaActual++;
                index++;
            }
            this.guardarProgres();
        }

        // Repartiment del dia: cada alumne exactament UN cop avui,
        // i mai en un racó on ja hagi estat els dies anteriors.
        generarDistribucio() {
            const visitats = this.racosVisitats();
            // Sempre existeix una distribució vàlida; si la tirada aleatòria
            // no quadra, es repeteix amb altra sort.
            for (let intent = 0; intent < 200; intent++) {
                const resultat = this.intentarDistribucio(visitats);
                if (resultat) return resultat;
            }
            return null;
        }

        intentarDistribucio(visitats) {
            const resultats = [[], [], [], [], []];
            const colocatsAvui = new Set();
            const ordreRacos = this.barrejar([0, 1, 2, 3, 4]);

            for (const raco of ordreRacos) {
                const candidats = [];
                for (let n = 1; n <= this.TOTAL_ALUMNES; n++) {
                    if (!colocatsAvui.has(n) && !visitats[n].has(raco)) {
                        candidats.push(n);
                    }
                }
                // Si a aquest racó no li queden 5 alumnes vàlids, l'intent falla
                if (candidats.length < this.PER_RACO) return null;

                this.barrejar(candidats);
                for (let i = 0; i < this.PER_RACO; i++) {
                    const num = candidats[i];
                    resultats[raco].push(num);
                    colocatsAvui.add(num);
                }
            }
            return resultats; // 5 racós x 5 alumnes = els 25, tots diferents
        }

        // Fisher-Yates
        barrejar(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        renderitzarHistorial() {
            const container = document.getElementById(this.containerId);
            container.innerHTML = '';
            this.historialResultats.forEach((res, index) => {
                this.renderitzarGraella(index + 1, res, false);
            });
        }

        renderitzarGraella(dia, resultatsDia, animar, offset = 0) {
            const container = document.getElementById(this.containerId);
            const graella = document.createElement('div');
            graella.className = 'graella-card';
            graella.innerHTML = `
                <div class="titol-dia">Dia ${dia}</div>
                <div class="pilars-container"></div>
            `;
            container.prepend(graella);

            const pilarsContainer = graella.querySelector('.pilars-container');

            for(let r = 0; r < 5; r++) {
                let pilar = document.createElement('div');
                pilar.className = 'pilar';
                pilar.innerHTML = `
                    <div class="pilar-header">Racó ${r + 1}</div>
                    <div class="pilar-body"></div>
                `;
                pilarsContainer.appendChild(pilar);

                let body = pilar.querySelector('.pilar-body');

                for(let p = 0; p < 5; p++) {
                    let num = resultatsDia[r][p];
                    let slot = document.createElement('div');
                    slot.className = 'persona-slot';
                    slot.innerText = num;
                    body.appendChild(slot);

                    if(animar) {
                        let delay = offset + (r) * 100 + p * 50;
                        setTimeout(() => {
                            slot.classList.add('filled');
                        }, delay);
                    } else {
                        slot.classList.add('filled');
                        slot.style.opacity = '1';
                        slot.style.transform = 'scale(1)';
                    }
                }
            }
        }

        novaBaralla(esNetejaManual) {
            if (esNetejaManual) {
                localStorage.removeItem(this.clau);
            }
            document.getElementById(this.containerId).innerHTML = '';
            this.diaActual = 1;
            this.historialResultats = [];
            this.guardarProgres();
        }

        estaAcabat() {
            return this.diaActual > this.TOTAL_DIES;
        }
    }

    // Iniciar les dues instàncies
    const jocMates = new SorteigAssignatura('mates', 'graelles-mates');
    const jocLlengua = new SorteigAssignatura('llengua', 'graelles-llengua');

    // --- GESTIÓ D'INTERFÍCIE I BOTONS ---
    let pestanyaActual = localStorage.getItem('pestanyaActual') || 'mates';

    function actualitzarBotons() {
        const btnSorteig = document.getElementById('btnSorteig');
        const btnTots = document.getElementById('btnTotsDies');
        const btnReset = document.getElementById('btnNovaBaralla');
        const jocActual = pestanyaActual === 'mates' ? jocMates : jocLlengua;

        // Botó Sorteig
        btnSorteig.disabled = jocActual.estaAcabat();
        btnSorteig.className = pestanyaActual; // Assigna color segons pestanya

        // Botó Tots els dies
        btnTots.disabled = jocActual.estaAcabat();
        btnTots.className = pestanyaActual;

        // Botó Reset Individual (Només actiu si l'assignatura actual està acabada)
        if (jocActual.estaAcabat()) {
            btnReset.disabled = false;
        } else {
            btnReset.disabled = true;
        }
    }

    function canviarPestanya(novaPestanya) {
        pestanyaActual = novaPestanya;
        localStorage.setItem('pestanyaActual', novaPestanya); // Guardar pestanya actual
        
        document.getElementById('mates-content').style.display = novaPestanya === 'mates' ? 'block' : 'none';
        document.getElementById('llengua-content').style.display = novaPestanya === 'llengua' ? 'block' : 'none';

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn.${novaPestanya}`).classList.add('active');

        actualitzarBotons();
    }

    function sorteigGlobal() {
        if (pestanyaActual === 'mates') {
            jocMates.sorteigDia();
        } else {
            jocLlengua.sorteigDia();
        }
        actualitzarBotons();
    }

    // NOU: sorteig automàtic de tots els dies que falten
    function totsElsDies() {
        const jocActual = pestanyaActual === 'mates' ? jocMates : jocLlengua;
        if (jocActual.estaAcabat()) return;

        const diaInicial = jocActual.diaActual;
        if (confirm("Això farà automàticament el sorteig del dia " + diaInicial + " al 5. Vols continuar?")) {
            jocActual.generarRestaDies();
            actualitzarBotons();
        }
    }

    // Nova funció: Només esborra l'apartat actual
    function novaBarallaActual() {
        let nomAssignatura = pestanyaActual === 'mates' ? 'Matemàtiques' : 'Llengua';
        if (confirm("Segur que vols començar una nova baralla per a " + nomAssignatura + "?")) {
            if (pestanyaActual === 'mates') {
                jocMates.novaBaralla(true);
            } else {
                jocLlengua.novaBaralla(true);
            }
            actualitzarBotons();
        }
    }

    // --- IMPRESSIÓ / PDF ---
    function prepararImpressio() {
        // Data actual en català
        const dataText = 'Sorteig del ' + new Date().toLocaleDateString('ca-ES', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });
        document.getElementById('printDateMates').textContent = dataText;
        document.getElementById('printDateLlengua').textContent = dataText;

        // Es.print-show tot seguit
        const matesTeDades = jocMates.historialResultats.length > 0;
        const llenguaTeDades = jocLlengua.historialResultats.length > 0;

        // S'imprimeixen les assignatures amb sorteig; si cap en té, es mostra la pestanya actual
        document.getElementById('mates-content').classList.toggle(
            'print-show', matesTeDades || (!llenguaTeDades && pestanyaActual === 'mates')
        );
        document.getElementById('llengua-content').classList.toggle(
            'print-show', llenguaTeDades || (!matesTeDades && pestanyaActual === 'llengua')
        );
    }

    function imprimirPDF() {
        prepararImpressio();
        window.print();
    }

    // També si l'usuari imprimeix amb Ctrl+P directament
    window.addEventListener('beforeprint', prepararImpressio);

    // Inicialitzar UI amb la pestanya guardada
    canviarPestanya(pestanyaActual);


    // --- FONS ANIMAT (SÍMBOLS) ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let simbols = [];

    const simbolsMates = ['+', '-', '=', 'π', '√', '∑', 'Δ', '∞', '÷', 'x', '%', '∫'];
    const simbolsLlengua = ['A', 'B', 'C', 'ç', 'ñ', '·', 'a', 'e', 'i', 'o', 'u', '?', '¡', '¿', ','];
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class SimbolFlotant {
        constructor() {
            this.reset(true);
        }
        reset(inicial = false) {
            this.x = Math.random() * canvas.width;
            this.y = inicial ? Math.random() * canvas.height : -100;
            this.size = Math.random() * 60 + 30;
            this.speedY = Math.random() * 0.3 + 0.05;
            this.speedX = (Math.random() - 0.5) * 0.1;
            
            let arr = pestanyaActual === 'mates' ? simbolsMates : simbolsLlengua;
            if (Math.random() < 0.2) arr = pestanyaActual === 'mates' ? simbolsLlengua : simbolsMates;
            this.char = arr[Math.floor(Math.random() * arr.length)];
            
            this.rotation = Math.random() * Math.PI;
            this.rotSpeed = (Math.random() - 0.5) * 0.005;
        }
        update() {
            this.y += this.speedY;
            this.x += this.speedX;
            this.rotation += this.rotSpeed;
            if (this.y > canvas.height + 100) this.reset();
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.font = `${this.size}px 'Inter', sans-serif`;
            // Colors més visibles però suaus
            let color = pestanyaActual === 'mates' ? '59, 130, 246' : '249, 115, 22';
            if (Math.random() < 0.5) color = '100, 116, 139'; // Gris
            
            ctx.fillStyle = `rgba(${color}, 0.08)`; // Lleugerament més opac perquè es vegin
            ctx.filter = `blur(1px)`; 
            ctx.fillText(this.char, 0, 0);
            ctx.restore();
            ctx.filter = 'none';
        }
    }

    function initSymbols() {
        simbols = [];
        let numSimbols = (canvas.width * canvas.height) / 50000;
        for (let i = 0; i < numSimbols; i++) {
            simbols.push(new SimbolFlotant());
        }
    }

    function animateBg() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        simbols.forEach(s => { s.update(); s.draw(); });
        requestAnimationFrame(animateBg);
    }

    window.addEventListener('resize', initSymbols);
    initSymbols();
    animateBg();

</script>

</body>
</html>
